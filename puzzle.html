<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chess School — Puzzle d'échecs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/vnd.icon" href="images/favicon.png">
</head>

<body>
    <div class="site-wrapper">
        <header id="base-header" class="site-header card">
            <div class="header-row">
                <div class="brand">
                    <h1 id="base-title">Chess School — Puzzle</h1>
                </div>
                <nav id="main-nav" class="main-nav" aria-label="Navigation principale">
                    <div class="nav-links" id="main-nav-list">
                        <a class="nav-link" href="index.html">Accueil</a>
                        <a class="nav-link" href="chessboard.html">Échiquier</a>
                        <a class="nav-link active" href="puzzle.html">Puzzle</a>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <div class="board-container">
                <div class="board-header">
                    <h2>Puzzle d'échecs</h2>
                    <p>Sélectionnez un puzzle puis cliquez sur <strong>Charger le puzzle</strong>. Jouez la solution ou
                        demandez à voir la solution.</p>
                </div>

                <div class="board-layout">
                    <div class="controls-panel">
                        <h3>Contrôles</h3>
                        <label for="puzzle-select">Choisir un puzzle</label>
                        <select id="puzzle-select">
                            <option value="0">Mat en 1 — Tour & Roi</option>
                            <option value="1">Mat en 2 — Dame & Roi</option>
                        </select>

                        <div style="margin-top:12px;">
                            <button class="action-btn" id="load-puzzle">Charger le puzzle</button>
                            <button class="action-btn secondary" id="show-solution">Montrer la solution</button>
                            <button class="action-btn" id="reset-puzzle">Réinitialiser</button>
                        </div>

                        <div class="info-box" style="margin-top:12px;">
                            <h4>Description</h4>
                            <div id="puzzle-desc">Aucun puzzle chargé.</div>
                        </div>
                    </div>

                    <div class="board-wrapper">
                        <div class="chessboard" id="chessboard"></div>
                        <div class="coordinates">
                            <span>a</span><span>b</span><span>c</span><span>d</span>
                            <span>e</span><span>f</span><span>g</span><span>h</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer id="base-footer" class="site-footer">
            <p>&copy; 2025 Chess School</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="save-system.js"></script>
    <script src="chessboard.js"></script>
    <script src="puzzle.js"></script>
</body>

</html>
